[project]
name = "navigator-backend"
version = "0.1.0"
description = "FastAPI backend for AI Codebase Navigator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.144.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
